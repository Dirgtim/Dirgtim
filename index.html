<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiN — Timeless Beauty & Skin Alchemy</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js via CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kin: {
                            bg: '#FAF7F5',
                            card: '#FFFFFF',
                            primary: '#8C6D58',
                            dark: '#2C221E',
                            accent: '#D4A373',
                            soft: '#F3E9E2',
                            gold: '#C5A059'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #FAF7F5; }
        ::-webkit-scrollbar-thumb { background: #D4A373; border-radius: 4px; }
    </style>
</head>
<body class="bg-kin-bg text-kin-dark font-sans antialiased selection:bg-kin-accent selection:text-white" 
      x-data="kinStore()">

    <!-- Header Navigation -->
    <nav class="sticky top-0 z-40 bg-kin-bg/90 backdrop-blur-md border-b border-kin-soft/80 transition-all">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" class="text-3xl font-serif font-bold tracking-widest text-kin-dark">KiN<span class="text-kin-accent">.</span></a>
            
            <div class="hidden md:flex items-center space-x-8 text-sm tracking-wide font-medium">
                <a href="#ungulan" class="hover:text-kin-accent transition-colors">Produk Laris</a>
                <a href="#koleksi" class="hover:text-kin-accent transition-colors">Koleksi Lengkap</a>
                <a href="#kontak" class="hover:text-kin-accent transition-colors">Kontak</a>
            </div>

            <div class="flex items-center space-x-5">
                <!-- Tombol Login Member -->
                <button @click="isLoginOpen = true" class="text-sm font-medium hover:text-kin-accent transition-colors flex items-center gap-2 bg-kin-soft/50 px-4 py-2 rounded-full border border-kin-soft">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <span>Member KiN</span>
                </button>

                <!-- Tombol Keranjang Belanja -->
                <button @click="isCartOpen = true" class="relative p-2.5 bg-kin-dark text-white rounded-full hover:bg-kin-primary transition-colors shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <span x-show="totalCartCount > 0" x-text="totalCartCount" class="absolute -top-1 -right-1 bg-kin-accent text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold border-2 border-white"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="max-w-7xl mx-auto px-6 py-16 md:py-24 grid md:grid-cols-2 gap-12 items-center">
        <div>
            <span class="text-xs uppercase tracking-[0.3em] font-semibold text-kin-accent block mb-4">Kemewahan Alami Alkimia Kulit</span>
            <h1 class="text-4xl md:text-6xl font-serif font-normal leading-tight mb-6">Pancarkan Pesona Kulit Abadi bersama <span class="italic font-serif text-kin-accent">KiN</span>.</h1>
            <p class="text-kin-dark/70 font-light mb-8 max-w-md leading-relaxed text-sm md:text-base">Formulasi dermatologi kelas dunia dipadukan dengan ekstrak botanical langka untuk menghidrasi, mencerahkan, serta meremajakan kulit Anda secara alami.</p>
            <div class="flex items-center gap-4">
                <a href="#ungulan" class="bg-kin-dark text-white px-8 py-4 rounded-full text-sm font-medium hover:bg-kin-primary transition-all duration-300 shadow-lg hover:shadow-xl">Lihat Produk Laris</a>
                <a href="#koleksi" class="border border-kin-dark/20 text-kin-dark px-6 py-4 rounded-full text-sm font-medium hover:bg-kin-
